<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aegis Last Dome</title>
<meta name="description" content="A retro space shooter. Fly above the last energy dome and keep the city under it alive. Plays on phone and desktop.">
<meta name="theme-color" content="#05070D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aegis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Aegis Last Dome">
<meta property="og:description" content="A retro space shooter. Keep the last energy dome standing.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* page shell: what the hosting page used to provide */
:root{color-scheme:dark;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one portrait arcade screen. A 180px-wide pixel playfield scaled up crisp;
   the dome is the Aegis hero shader on its own layer between background and sprites;
   HUD and menus are DOM, sized in the same pixel unit (--u) as the playfield. */
:root{
  color-scheme:dark;
  --void:#05070D; --scrim:rgba(5,7,13,.82);
  --ink:#EAF8FF; --dim:#7388A3; --line:#1A2740;
  --dome:#66E8FA; --dome-blue:#3B82F6; --dome-deep:#123A5C;
  --amber:#FFC46B; --alert:#F85266;
  --font-arcade:"Press Start 2P","Courier New",ui-monospace,monospace;
  --font-text:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --u:2px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--font-text);overflow:hidden;overscroll-behavior:none}
.app{height:100%;height:100dvh;display:flex;align-items:center;justify-content:center}
.stage{--font-ui:var(--font-arcade);--ui-w:400;position:relative;overflow:hidden;background:var(--void);box-shadow:0 0 0 1px var(--line);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.layers{position:absolute;inset:0;will-change:transform}
.layers canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--u) - 1px),rgba(0,0,0,.16) calc(var(--u) - 1px),rgba(0,0,0,.16) var(--u))}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--font-ui);font-weight:var(--ui-w);font-size:calc(var(--u)*6);line-height:1;z-index:2}
.hud-top{position:absolute;top:calc(var(--u)*4);left:calc(var(--u)*4);right:calc(var(--u)*4);display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--u)*4)}
.hud .lab{display:block;font-size:calc(var(--u)*4.5);color:var(--dim);letter-spacing:.08em;margin-bottom:calc(var(--u)*2)}
.hud .mid{text-align:center}
.chain{color:var(--amber);margin-left:calc(var(--u)*3)}
.iconbtn{pointer-events:auto;font:inherit;color:var(--ink);background:rgba(5,7,13,.5);border:calc(var(--u)*1) solid var(--line);
  width:calc(var(--u)*17);height:calc(var(--u)*17);min-width:36px;min-height:36px;cursor:pointer;padding:0}
.domebar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*2.5);display:flex;align-items:center;gap:calc(var(--u)*3)}
.domebar .lab{margin:0;white-space:nowrap}
.segs{display:flex;gap:calc(var(--u)*1)}
.segs i{display:block;width:calc(var(--u)*5);height:calc(var(--u)*5);background:var(--dome-deep)}
.segs i.on{background:var(--dome)}
.segs.warn i.on{background:var(--amber)}
.segs.crit i.on{background:var(--alert)}
.pulse{pointer-events:auto;position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*14);width:calc(var(--u)*34);height:calc(var(--u)*34);
  font:inherit;font-size:calc(var(--u)*5);color:var(--dim);background:rgba(5,7,13,.6);border:calc(var(--u)*1) solid var(--dome-deep);
  padding:0;cursor:pointer;overflow:hidden}
.pulse .fill{position:absolute;left:0;right:0;bottom:0;height:var(--c,0%);background:var(--dome-deep)}
.pulse .txt{position:relative}
.pulsetip{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*51);margin:0;padding:calc(var(--u)*2.5) calc(var(--u)*3);background:var(--amber);color:var(--void);
  font-size:calc(var(--u)*5);animation:flash .5s steps(2) 4}
.pulse.ready{color:var(--void);border-color:var(--ink);animation:blink .5s steps(2) infinite}
.pulse.ready .fill{background:var(--dome)}
@keyframes blink{50%{filter:brightness(1.5)}}
.banner{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:var(--font-ui);font-weight:var(--ui-w);font-size:calc(var(--u)*10);
  color:var(--dome);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--void);pointer-events:none;z-index:2;animation:flash .34s steps(2) 3}
.banner.warn{color:var(--alert)}
@keyframes flash{50%{opacity:.15}}

/* Menus */
.overlay{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6);
  padding:calc(var(--u)*14) calc(var(--u)*10) 0;text-align:center;pointer-events:none}
.overlay>*{pointer-events:auto}
.overlay.scrim{background:var(--scrim);justify-content:center;padding-block:calc(var(--u)*10);pointer-events:auto}
h1{font-family:var(--font-arcade);font-weight:400;font-size:calc(var(--u)*26);line-height:1;margin:0;color:var(--ink);
  text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 var(--dome-blue),0 0 calc(var(--u)*14) rgba(102,232,250,.45);letter-spacing:.04em}
h2{font-family:var(--font-ui);font-weight:var(--ui-w);font-size:calc(var(--u)*13);line-height:1.2;margin:0;color:var(--ink)}
.sub{font-family:var(--font-ui);font-weight:var(--ui-w);font-size:calc(var(--u)*7);letter-spacing:.3em;color:var(--dome);margin:calc(var(--u)*-2) 0 0 .3em}
.btn{font-family:var(--font-ui);font-weight:var(--ui-w);font-size:calc(var(--u)*8);color:var(--void);background:var(--dome);border:0;cursor:pointer;
  padding:calc(var(--u)*6) calc(var(--u)*10);box-shadow:0 calc(var(--u)*2) 0 var(--dome-blue);min-height:44px}
.btn:active{transform:translateY(calc(var(--u)*2));box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 calc(var(--u)*1) var(--line)}
.btn.sm{font-family:var(--font-text);font-size:max(13px,calc(var(--u)*6));font-weight:600;padding:calc(var(--u)*3.5) calc(var(--u)*5);min-height:36px;
  display:inline-flex;align-items:center;justify-content:center}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.help{font-size:max(13px,calc(var(--u)*6.2));line-height:1.6;color:var(--ink);max-width:calc(var(--u)*158);margin:0;text-wrap:balance}
.help.dim{color:var(--dim)}
select.btn{appearance:none;-webkit-appearance:none;border-radius:0;text-align:center;text-align-last:center}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*4);text-align:left;width:100%;max-width:calc(var(--u)*160);
  font-size:max(13px,calc(var(--u)*6));line-height:1.5;overflow-y:auto;min-height:0}
.how b{display:block;color:var(--dome);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:calc(var(--u)*3);justify-content:center;max-width:100%}
.track{font-size:max(12px,calc(var(--u)*5.4));color:var(--dim);margin:0;max-width:calc(var(--u)*150);overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:auto auto;gap:calc(var(--u)*4) calc(var(--u)*10);font-family:var(--font-ui);font-weight:var(--ui-w);font-size:calc(var(--u)*7);
  text-align:left;margin:0;font-variant-numeric:tabular-nums}
.stats dt{color:var(--dim)}
.stats dd{margin:0;text-align:right;font-family:var(--font-arcade);font-weight:400}
.newbest{font-family:var(--font-ui);font-weight:var(--ui-w);font-size:calc(var(--u)*6);color:var(--amber);margin:0;animation:flash .5s steps(2) infinite}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* Title extras and the hangar (ship, paint, shield effect, planet) */
#titleScr{gap:calc(var(--u)*5)}
[data-track]:empty{display:none}
.btn.has-new{position:relative}
.btn.has-new::after{content:"";position:absolute;top:calc(var(--u)*-2);right:calc(var(--u)*-2);width:calc(var(--u)*5);height:calc(var(--u)*5);background:var(--amber)}
.hint{font-size:max(12px,calc(var(--u)*5.6));color:var(--dim);margin:calc(var(--u)*-2) 0 0}
#hangarScr{padding:0}
.panel{width:100%;background:var(--scrim);border-bottom:calc(var(--u)*1) solid var(--line);display:flex;flex-direction:column;align-items:center;
  gap:calc(var(--u)*4);padding:calc(var(--u)*7) calc(var(--u)*8) calc(var(--u)*6)}
.panel-head{width:100%;display:flex;justify-content:space-between;align-items:center}
.panel-head h2{font-size:calc(var(--u)*9)}
.tabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*2)}
.tabs button{font-family:var(--font-text);font-weight:600;font-size:max(13px,calc(var(--u)*6));color:var(--ink);background:transparent;border:0;
  box-shadow:inset 0 0 0 calc(var(--u)*1) var(--line);min-height:36px;padding:0;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--dome);color:var(--void);box-shadow:none}
.trait{font-size:max(12px,calc(var(--u)*5.8));line-height:1.4;color:var(--ink);margin:0;text-wrap:balance;min-height:2.8em;display:flex;align-items:center}
.bars{width:100%;max-width:calc(var(--u)*150);display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.5) calc(var(--u)*10);margin:0}
.bars div{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*3)}
.bars dt{font-size:max(12px,calc(var(--u)*5.6));color:var(--dim)}
.bars dd{margin:0;display:flex;gap:calc(var(--u)*1)}
.bars i{display:block;width:calc(var(--u)*5);height:calc(var(--u)*4);background:var(--line)}
.bars i.on{background:var(--dome)}
.action{min-height:34px;display:flex;align-items:center;justify-content:center}
.owned{font-size:max(12px,calc(var(--u)*5.8));font-weight:600;color:var(--dome)}
.wallet{font-family:var(--font-arcade);font-size:calc(var(--u)*6);color:var(--amber);display:inline-flex;align-items:center;gap:calc(var(--u)*3);margin:0;font-variant-numeric:tabular-nums}
.wallet .best{color:var(--dim);margin-left:calc(var(--u)*5);font-family:var(--font-ui);font-weight:var(--ui-w)}
.core{display:inline-block;flex:none;width:calc(var(--u)*4.5);height:calc(var(--u)*4.5);background:var(--amber);transform:rotate(45deg)}
.picker{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*3);width:100%}
.picker .arrow{font-family:var(--font-arcade);font-size:calc(var(--u)*8);color:var(--ink);background:rgba(5,7,13,.55);border:calc(var(--u)*1) solid var(--line);
  width:calc(var(--u)*18);height:calc(var(--u)*18);min-width:38px;min-height:38px;padding:0;cursor:pointer}
.picker .mid{min-width:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.5)}
.picker .name{font-family:var(--font-ui);font-weight:var(--ui-w);font-size:calc(var(--u)*7);color:var(--dome)}
.picker .count{font-family:var(--font-arcade);font-size:calc(var(--u)*4.5);color:var(--dim)}
.unlock{font-family:var(--font-text);font-weight:600;font-size:max(12px,calc(var(--u)*5.6));color:var(--void);background:var(--amber);border:0;
  padding:calc(var(--u)*2) calc(var(--u)*5);min-height:32px;cursor:pointer;display:inline-flex;align-items:center;gap:calc(var(--u)*3)}
.unlock .core{background:var(--void)}
.unlock:disabled{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 calc(var(--u)*1) var(--line);cursor:default}
.unlock:disabled .core{background:var(--dim)}
.btn:disabled{background:var(--line);color:var(--dim);box-shadow:none;cursor:default;transform:none}
.stats dt .core{vertical-align:middle}
.row{display:flex;flex-wrap:wrap;gap:calc(var(--u)*4);justify-content:center}
/* Numbers and symbols stay in the arcade face in every language; words follow the language's own script */
.num{font-family:var(--font-arcade);font-weight:400}
.pausebtn{display:inline-flex;align-items:center;justify-content:center}
.pausebtn .bars{display:block;width:calc(var(--u)*7);height:calc(var(--u)*7);background:linear-gradient(to right,currentColor 0 calc(var(--u)*2.5),transparent calc(var(--u)*2.5) calc(var(--u)*4.5),currentColor calc(var(--u)*4.5))}
.stage:not(.cjk) h2{text-transform:uppercase}
.stage.cjk{--font-ui:var(--font-text);--ui-w:700}
.stage.cjk .hud .lab{font-size:max(11px,calc(var(--u)*5.4));letter-spacing:0}
.stage.cjk .pulse,.stage.cjk .pulsetip{font-size:max(12px,calc(var(--u)*6.4))}
.stage.cjk .picker .name{font-size:max(15px,calc(var(--u)*8))}
.stage.cjk .banner{font-size:calc(var(--u)*12)}
.stage.cjk .wallet .best{font-size:max(11px,calc(var(--u)*5.6))}
@media (prefers-reduced-motion:reduce){.banner,.pulse.ready,.newbest,.pulsetip{animation:none}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="stage" id="stage">
    <div class="layers" id="layers">
      <canvas id="bg" width="180" height="320"></canvas>
      <canvas id="dome" width="360" height="640"></canvas>
      <canvas id="fg" width="180" height="320" role="img" aria-label="Game screen"></canvas>
    </div>

    <div class="hud" id="hud" hidden>
      <div class="hud-top">
        <div><span class="lab" data-i18n="score">SCORE</span><span class="num" id="score">000000</span><span class="chain num" id="chain"></span></div>
        <div class="mid"><span class="lab" data-i18n="wave">WAVE</span><span class="num" id="wave">1</span></div>
        <button class="iconbtn pausebtn" id="pauseBtn" type="button" data-i18n-aria="pause" aria-label="Pause"><span class="bars"></span></button>
      </div>
      <div class="domebar" aria-hidden="true"><span class="lab" data-i18n="domeLab">DOME</span><div class="segs" id="segs"></div></div>
      <p class="pulsetip" id="pulseTip" data-i18n="pulseReady" hidden>BLAST READY!</p>
      <button class="pulse" id="pulseBtn" type="button" data-i18n-aria="pulseAria" aria-label="Release the blast"><span class="fill"></span><span class="txt" data-i18n="pulse">BLAST</span></button>
    </div>
    <div class="banner" id="banner" hidden></div>

    <div class="overlay" id="titleScr">
      <h1>AEGIS</h1>
      <p class="sub" data-i18n="sub">LAST DOME</p>
      <p class="wallet"><span class="core" role="img" data-i18n-aria="cores" aria-label="Cores"></span><span id="cores">0</span><span class="best" id="bestLine" hidden><span data-i18n="best">BEST</span> <span class="num" id="bestNum"></span></span></p>
      <button class="btn" id="startBtn" type="button" data-i18n="start">START</button>
      <button class="btn ghost" id="hangarBtn" type="button" data-i18n="hangar">HANGAR</button>
      <p class="hint" data-i18n="hangarHint">Ships, paint, shield effects and planets</p>
      <div class="opts">
        <button class="btn ghost sm" type="button" id="howBtn" data-i18n="howto">How to play</button>
        <select class="btn ghost sm" id="langSel" aria-label="Language"></select>
      </div>
      <div class="opts">
        <button class="btn ghost sm" type="button" data-act="sfx">Sound on</button>
        <button class="btn ghost sm" type="button" data-act="mus">Music on</button>
        <label class="btn ghost sm" for="musicFile" data-i18n="myMusic">Use my music</label>
      </div>
      <p class="track" data-track></p>
    </div>

    <div class="overlay" id="hangarScr" hidden>
      <div class="panel">
        <div class="panel-head"><h2 data-i18n="hangar">HANGAR</h2><p class="wallet"><span class="core" role="img" data-i18n-aria="cores" aria-label="Cores"></span><span id="cores2">0</span></p></div>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="ship" data-i18n="tabShip">Ship</button>
          <button type="button" role="tab" data-tab="paint" data-i18n="tabPaint">Paint</button>
          <button type="button" role="tab" data-tab="fx" data-i18n="tabFx">Shield</button>
          <button type="button" role="tab" data-tab="planet" data-i18n="tabPlanet">Planet</button>
        </div>
        <div class="picker">
          <button class="arrow" type="button" data-dir="-1" data-i18n-aria="prev" aria-label="Previous">&lt;</button>
          <div class="mid"><span class="name" id="itemName"></span><span class="count" id="itemCount"></span></div>
          <button class="arrow" type="button" data-dir="1" data-i18n-aria="next" aria-label="Next">&gt;</button>
        </div>
        <p class="trait" id="itemTrait"></p>
        <dl class="bars" id="itemStats" hidden></dl>
        <div class="action"><span class="owned" id="itemOwned" data-i18n="inUse">In use</span><button class="unlock" id="itemUnlock" type="button" hidden></button></div>
        <button class="btn" id="hangarDone" type="button" data-i18n="done">DONE</button>
      </div>
    </div>

    <div class="overlay scrim" id="howScr" hidden>
      <h2 data-i18n="howto">How to play</h2>
      <ul class="how" id="howList"></ul>
      <button class="btn" id="howClose" type="button">GOT IT</button>
    </div>

    <div class="overlay scrim" id="pauseScr" hidden>
      <h2 data-i18n="paused">PAUSED</h2>
      <button class="btn" id="resumeBtn" type="button" data-i18n="resume">RESUME</button>
      <div class="row"><button class="btn ghost" id="restartBtn" type="button" data-i18n="restart">RESTART</button><button class="btn ghost" type="button" data-menu data-i18n="menu">MENU</button></div>
      <div class="opts">
        <button class="btn ghost sm" type="button" data-act="sfx">Sound on</button>
        <button class="btn ghost sm" type="button" data-act="mus">Music on</button>
        <label class="btn ghost sm" for="musicFile" data-i18n="myMusic">Use my music</label>
      </div>
      <p class="track" data-track></p>
    </div>

    <div class="overlay scrim" id="overScr" hidden>
      <h2 data-i18n="gameOver">GAME OVER</h2>
      <p class="help" data-i18n="domeLost">The dome has fallen.</p>
      <dl class="stats">
        <dt data-i18n="score">SCORE</dt><dd id="overScore">0</dd>
        <dt data-i18n="wave">WAVE</dt><dd id="overWave">1</dd>
        <dt data-i18n="best">BEST</dt><dd id="overBest">0</dd>
        <dt><span class="core" role="img" data-i18n-aria="cores" aria-label="Cores"></span></dt><dd id="overCores">+0</dd>
      </dl>
      <p class="newbest" id="newBest" data-i18n="newBest" hidden>NEW BEST!</p>
      <p class="help dim" id="overHint" data-i18n="overHint" hidden></p>
      <div class="row"><button class="btn" id="retryBtn" type="button" data-i18n="retry">RETRY</button><button class="btn ghost" type="button" data-menu data-i18n="menu">MENU</button></div>
    </div>

    <input class="sr" type="file" id="musicFile" accept="audio/*" data-i18n-aria="chooseMusic" aria-label="Choose a music file">
  </div>
</div>

<script>
(() => {
'use strict';
/* ---------- setup ---------- */
const W = 180, GLS = 2;            // playfield width in game px; dome buffer px per game px
// To ship a soundtrack with the page, publish the file next to it and put its relative path here.
const MUSIC_SRC = 'music.mp3';
let H = 320, scale = 2;
const $ = id => document.getElementById(id);
const app = $('app'), stage = $('stage'), layers = $('layers');
const bgC = $('bg'), glC = $('dome'), fgC = $('fg');
const bg = bgC.getContext('2d'), ctx = fgC.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const store = {
  get(k, d) { try { const v = localStorage.getItem('aegisdome.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('aegisdome.' + k, JSON.stringify(v)); } catch {} },
};

/* ---------- languages ----------
   Every word on screen comes from here, so each language reads as one language.

/* ---------- the dome: Aegis hero force-field shader ---------- */
const MAX_IMP = 8;
const VERT = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform float uTime;
uniform vec3 uDome;          // centre x, ground y (GL px), radius px
uniform vec3 uMouse;         // x, y (GL px), active 0..1
uniform vec4 uState;         // integrity 0..1, flash, live-cell fraction, fade
uniform vec3 uColA;          // the planet's dome colours: body, rim
uniform vec3 uColB;
uniform vec4 uFx;            // shield effect: lattice (0 hex, 1 grid, 2 scales), crackle gain, prism 0..1, aurora 0..1
uniform vec4 uImp[${MAX_IMP}]; // x, y (GL px), start time, strength (0 = unused)

const vec3 WHITE = vec3(0.92, 0.99, 1.0);

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec2 hash2(vec2 p){ return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 4; i++){ v += a * noise(p); p *= 2.03; a *= .5; } return v; }

// distance to the nearest hex-cell edge (0 at the edge); id names the cell
float hexEdge(vec2 p, out vec2 id){
  vec2 r = vec2(1., 1.7320508), h = r * .5;
  vec2 a = mod(p, r) - h, b = mod(p - h, r) - h;
  vec2 g;
  if (dot(a, a) < dot(b, b)) { g = a; id = floor(p / r); } else { g = b; id = floor((p - h) / r) + .5; }
  g = abs(g);
  return .5 - max(dot(g, normalize(r)), g.x);
}

// voronoi F2 - F1: thin lines along cell borders (the "crackle")
float crackle(vec2 x){
  vec2 n = floor(x), f = fract(x);
  float f1 = 8., f2 = 8.;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 g = vec2(float(i), float(j));
    vec2 o = .5 + .5 * sin(uTime * .6 + 6.2831 * hash2(n + g));
    float d = length(g + o - f);
    if (d < f1){ f2 = f1; f1 = d; } else if (d < f2){ f2 = d; }
  }
  return f2 - f1;
}

void main(){
  vec2 p = (gl_FragCoord.xy - uDome.xy) / uDome.z;
  float r = length(p);
  vec3 col = vec3(0.);
  float alpha = 0.;

  // the dome shifts from its planet's colours toward red as integrity runs out
  float k = smoothstep(.12, .5, uState.x);
  vec3 BLUE = mix(vec3(0.85, 0.20, 0.30), uColA, k);
  vec3 CYAN = mix(vec3(1.0, 0.62, 0.45), uColB, k);

  float ground = exp(-abs(p.y) * 55.) * smoothstep(1.2, .5, abs(p.x));
  col += CYAN * ground * .7;
  alpha += ground * .5;

  float energy = 0.;
  float ring = 0.;
  for (int i = 0; i < ${MAX_IMP}; i++){
    vec4 im = uImp[i];
    if (im.w <= 0.) continue;
    vec2 q = (im.xy - uDome.xy) / uDome.z;
    float age = uTime - im.z;
    float d = length(p - q);
    ring += im.w * smoothstep(.045, 0., abs(d - age * 1.3)) * exp(-age * 2.6);
    energy += im.w * exp(-d * 7.) * exp(-age * 3.5);
  }
  vec2 mp = (uMouse.xy - uDome.xy) / uDome.z;
  float hover = uMouse.z * exp(-length(p - mp) * 3.5);

  if (p.y > 0. && r < 1.) {
    float z = sqrt(1. - r * r);
    float fres = pow(1. - z, 2.6);
    vec2 sp = p / (.35 + z);                       // pseudo-spherical surface coords
    vec2 cell;
    float he;
    vec2 lp = sp * 6.5 + vec2(0., uTime * .05);
    if (uFx.x < .5) he = hexEdge(lp, cell);
    else {                                         // square grid, or the same grid turned 45 degrees into scales
      vec2 gp = lp * .8;
      if (uFx.x > 1.5) gp = vec2(gp.x - gp.y, gp.x + gp.y) * .7071;
      cell = floor(gp);
      vec2 gf = abs(fract(gp) - .5);
      he = .5 - max(gf.x, gf.y);
    }
    float dead = step(uState.z, hash(cell + 7.));  // cells go dark as the dome takes damage
    float live = 1. - dead * .7;
    float hexLine = smoothstep(.06, 0., he) * (1. - dead * .55);
    float flow = fbm(sp * 2.2 + vec2(uTime * .05, -uTime * .18));
    float storm = uFx.y - 1.;
    float cr = smoothstep(.05, 0., crackle(sp * 3.2)) * smoothstep(.55, .8, fbm(sp * 1.5 - uTime * .12) + storm * .11) * (1. + storm * .5);
    float bolt = storm * step(.92, hash(vec2(floor(uTime * 9.), 3.))) * .1;
    float breathe = .85 + .15 * sin(uTime * 1.3);
    float e = energy * 2. + ring + hover * .7 + uState.y + bolt;

    // prism: the dome's two colours give way to a rainbow that turns with the viewing angle
    vec3 rainbow = .55 + .45 * cos(6.2831 * (fres * .9 + sp.x * .3 + sp.y * .2 + uTime * .07 + vec3(0., .33, .67)));
    float pz = uFx.z * k;
    vec3 cA = mix(BLUE, rainbow * .8, pz), cB = mix(CYAN, rainbow, pz);

    const sp = shipSprite(SHIP, PAINT), px = onTitle ? dome.cx : player.x, py = onTitle ? previewY() + Math.round(Math.sin(S.t * 2) * 1.5) : player.y;
    put(sp, px, py);
    const fx = Math.round(px - sp.w / 2) + (sp.w >> 1), fy = Math.round(py - sp.h / 2) + sp.h, fl = ((S.t * 20) | 0) % 2;
    ctx.fillStyle = fl ? '#FFC46B' : '#FF9A4D'; for (const o of SHIP.flames) ctx.fillRect(fx + o, fy, 1, 1 + fl);
  }
  for (const p of parts) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
  for (const r of rings) pxCircle(ctx, r.x, r.y, r.r, r.c);
  for (const p of pops) tiny(p.txt, p.x, p.y, p.col);
  if (S.state === 'title' && pointer) {                 // the attacker's reticle from the hero
    const x = Math.round(pointer.x), y = Math.round(pointer.y);
    pxCircle(ctx, x, y, 6, '#F85266'); ctx.fillStyle = '#F85266'; ctx.fillRect(x - 10, y, 4, 1); ctx.fillRect(x + 7, y, 4, 1);
  }
  const sh = S.shake > 0 ? S.shake : 0;
  layers.style.transform = sh ? `translate(${Math.round(rnd(-sh, sh)) * scale}px,${Math.round(rnd(-sh, sh)) * scale}px)` : '';
}

/* ---------- HUD ---------- */
const cache = {};
function setText(id, v) { if (cache[id] !== v) { cache[id] = v; $(id).textContent = v; } }
const segs = $('segs'); for (let i = 0; i < 12; i++) segs.appendChild(document.createElement('i'));
function syncHud() {
  setText('score', String(S.score).padStart(6, '0'));
  setText('wave', String(Math.max(1, S.wave)));
  setText('chain', mult() > 1 ? 'x' + mult() : '');
  const lit = Math.ceil(clamp(dome.integrity, 0, 100) / 100 * 12);
  if (cache.lit !== lit) { cache.lit = lit; [...segs.children].forEach((el, i) => el.classList.toggle('on', i < lit)); segs.className = 'segs' + (lit <= 3 ? ' crit' : lit <= 6 ? ' warn' : ''); }
  const c = Math.floor(S.charge);
  if (cache.c !== c) {
    cache.c = c; const b = $('pulseBtn'); b.style.setProperty('--c', c + '%'); b.classList.toggle('ready', c >= 100);
    if (c >= 100 && S.state === 'play') {            // the first few times the blast fills up, say so next to the button
      const seen = store.get('tips', 0);
      if (seen < 5) { store.set('tips', seen + 1); $('pulseTip').hidden = false; S.tipT = 3.5; }
    }
  }
}

/* ---------- flow ---------- */
function show(id) { for (const k of ['titleScr', 'hangarScr', 'howScr', 'pauseScr', 'overScr']) $(k).hidden = k !== id; }
const anyAffordable = () => Object.values(KINDS).some(k => k.list.some(it => !Wallet.owns(it.id) && Wallet.canAfford(it)));
function syncMenu() {
  $('cores').textContent = save.cores;
  const hi = save.hi[P.id] || 0;
  $('bestLine').hidden = !hi; $('bestNum').textContent = String(hi).padStart(6, '0');
  $('hangarBtn').classList.toggle('has-new', anyAffordable());
}

/* ---------- hangar: browse, preview and unlock ---------- */
let tab = 'ship', confirmId = null;
function syncHangar() {
  $('cores2').textContent = save.cores;
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  const list = KINDS[tab].list, item = getView(tab), owned = Wallet.owns(item.id);
  $('itemName').textContent = itemName(item);
  $('itemCount').textContent = (list.indexOf(item) + 1) + '/' + list.length;
  $('itemTrait').textContent = itemDesc(item);
  const st = $('itemStats'); st.hidden = tab !== 'ship';
  if (tab === 'ship') {
    st.textContent = '';
    item.stats.forEach((v, i) => {
      const row = document.createElement('div'), dt = document.createElement('dt'), dd = document.createElement('dd');
      dt.textContent = t('stats')[i]; dd.setAttribute('aria-label', v + ' / 5');
      for (let n = 0; n < 5; n++) { const pip = document.createElement('i'); if (n < v) pip.className = 'on'; dd.appendChild(pip); }
      row.append(dt, dd); st.appendChild(row);
    });
  }
  const btn = $('itemUnlock');
  $('itemOwned').hidden = !owned; btn.hidden = owned;
  if (!owned) {
    const lack = item.cost - save.cores;
    btn.disabled = lack > 0;
    btn.innerHTML = '<span class="core"></span>';
    btn.append(lack > 0 ? t('short', { n: item.cost, m: lack }) : confirmId === item.id ? t('confirm', { n: item.cost }) : t('unlock', { n: item.cost }));
  }
}
function showItem(kind, item) {
  setView(kind, item);
  if (kind === 'planet') { impacts.fill(0); applyPlanet(); dome.flash = 0.5; }
  else if (kind === 'fx') dome.flash = 0.4;
  else { shots = []; S.demoT = 0.15; }
}
function cycle(dir) {
  const list = KINDS[tab].list, next = list[(list.indexOf(getView(tab)) + dir + list.length) % list.length];
  confirmId = null; showItem(tab, next);
  if (Wallet.owns(next.id)) { save[tab] = next.id; persist(); }       // browsing to something you own equips it
  syncHangar();
}
function unlock() {
  const item = getView(tab);
  if (Wallet.owns(item.id) || !Wallet.canAfford(item)) return;
  audioInit();
  if (confirmId !== item.id) { confirmId = item.id; syncHangar(); return; }   // second tap confirms
  confirmId = null;
  if (Wallet.buy(item)) { save[tab] = item.id; persist(); SFX.pick(); dome.flash = 0.8; addImpact(dome.cx, dome.cy - dome.R * 0.6, 1.4); }
  syncHangar();
}
function revertViews() {              // drop any locked item that was only being previewed
  for (const k in KINDS) { const it = equipped(k); if (getView(k) !== it) showItem(k, it); }
}
function openHangar() { audioInit(); S.hangar = true; confirmId = null; S.demoT = 0.3; show('hangarScr'); syncHangar(); }
function closeHangar() { S.hangar = false; shots = []; revertViews(); show('titleScr'); syncMenu(); }
$('hangarBtn').addEventListener('click', openHangar);
$('hangarDone').addEventListener('click', closeHangar);
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; confirmId = null; shots = []; S.demoT = 0.15; syncHangar(); }));
document.querySelectorAll('#hangarScr .arrow').forEach(b => b.addEventListener('click', () => cycle(+b.dataset.dir)));
$('itemUnlock').addEventListener('click', unlock);
function toTitle() {
  musicStop();
  enemies = []; shots = []; eshots = []; parts = []; rings = []; picks = []; pops = []; pulses = [];
  Object.assign(dome, { integrity: 100, shown: 100, flash: 0.4, collapse: null });
  impacts.fill(0); S.state = 'title'; S.hangar = false; S.shake = 0; S.spawnT = 0.6; drag = null;
  revertViews();
  $('hud').hidden = true; $('banner').hidden = true; $('pulseTip').hidden = true; S.tipT = 0; show('titleScr'); syncMenu();
}
document.querySelectorAll('[data-menu]').forEach(b => b.addEventListener('click', toTitle));

function startGame() {
  S.hangar = false; revertViews();
  audioInit();
  enemies = []; shots = []; eshots = []; parts = []; rings = []; picks = []; pops = []; pulses = [];
  Object.assign(S, { state: 'play', score: 0, bosses: 0, wave: 0, chain: 0, chainT: 0, charge: 50, shake: 0, dieT: 0, dieTick: 0, newBest: false });
  Object.assign(dome, { integrity: 100, shown: 100, flash: 0.6, collapse: null });
  impacts.fill(0);
  Object.assign(player, { tx: W / 2, ty: dome.cy - dome.R - 34, lvl: 1, inv: 1.5, fire: 0.3 });
  player.x = player.tx; player.y = player.ty; pointer = null; drag = null;
  show(null); $('hud').hidden = false; $('pulseTip').hidden = true; S.tipT = 0; S.how = false;
  musicStop(); musicStart(); nextWave();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch {}
}
function startDying() {
  if (S.state !== 'play') return;
  dome.integrity = 0; S.state = 'dying'; S.dieT = 0; S.dieTick = 0; dome.collapse = 1; S.tipT = 0; $('pulseTip').hidden = true;
  for (let i = 0; i < 5; i++) addImpact(dome.cx + rnd(-60, 60), dome.cy - rnd(10, 60), 1.5);
  musicStop(); SFX.over(); shake(4);
}
function gameOver() {
  S.state = 'over';
  const hi = save.hi[P.id] || 0;
  S.newBest = S.score > hi; if (S.newBest) save.hi[P.id] = S.score;
  // cores, the currency that unlocks things: 1 per 50 points, 5 per wave reached, 50 per boss
  const earned = Math.round(S.score / 50) + S.wave * 5 + S.bosses * 50;
  Wallet.earn(earned);
  $('overScore').textContent = S.score; $('overWave').textContent = S.wave; $('overBest').textContent = save.hi[P.id] || 0;
  $('overCores').textContent = '+' + earned;
  $('overHint').hidden = !anyAffordable();
  $('newBest').hidden = !S.newBest; $('hud').hidden = true; show('overScr'); $('retryBtn').focus({ preventScroll: true });
}
function setPause(on) {
  if (on && S.state === 'play') { S.state = 'pause'; $('banner').hidden = true; S.bannerT = 0; show('pauseScr'); musicStop(); }
  else if (!on && S.state === 'pause') { S.state = 'play'; show(null); musicStart(); }
}
// The first START explains the game before it begins; afterwards the same sheet is behind "How to play".
let howThenStart = false;
function openHow(thenStart) {
  howThenStart = thenStart; S.how = true;
  $('howClose').textContent = t(thenStart ? 'start' : 'gotIt');
  show('howScr'); $('howClose').focus({ preventScroll: true });
}
function closeHow() {
  S.how = false; store.set('seenHow', true);
  if (howThenStart) startGame(); else show('titleScr');
}
function startPressed() { if (store.get('seenHow', false)) startGame(); else openHow(true); }
$('howBtn').addEventListener('click', () => openHow(false));
$('howClose').addEventListener('click', closeHow);
$('startBtn').addEventListener('click', startPressed);

/* ---------- language ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  stage.classList.toggle('cjk', lang !== 'en' && lang !== 'es');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  fgC.setAttribute('aria-label', t('canvasAria'));
  const ul = $('howList'); ul.textContent = '';
  for (const [head, text] of t('how')) { const li = document.createElement('li'), b = document.createElement('b'); b.textContent = head; li.append(b, text); ul.appendChild(li); }
  syncOpts(); syncMenu(); if (S.hangar) syncHangar();
}
function initLang() {
  const sel = $('langSel');
  for (const [code, label] of LANGS) { const o = document.createElement('option'); o.value = code; o.textContent = label; o.lang = code; sel.appendChild(o); }
  sel.value = lang;
  sel.addEventListener('change', () => { if (T[sel.value]) { lang = sel.value; store.set('lang', lang); applyLang(); } });
  applyLang();
}
$('retryBtn').addEventListener('click', startGame);
$('restartBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', () => setPause(false));
$('pauseBtn').addEventListener('click', () => setPause(true));
$('pulseBtn').addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); firePulse(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* ---------- input ---------- */
let drag = null;
function toGame(e) { const r = fgC.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
const onControl = e => e.target.closest && e.target.closest('button,label,input,select,a,.panel,.scrim');
stage.addEventListener('pointerdown', e => {
  if (onControl(e)) return;
  audioInit();
  const p = toGame(e);
  if (S.state === 'title') {                    // like the hero: a tap fires a burst of attacks at the dome
    if (!reduced) for (let i = 0; i < 5; i++) setTimeout(() => S.state === 'title' && spawnAttack({ x: p.x, y: p.y }), i * 90);
    else addImpact(p.x, p.y, 1);
    return;
  }
  if (S.state !== 'play') return;
  e.preventDefault();
  if (e.pointerType === 'mouse') { player.tx = p.x; player.ty = p.y; firePulse(); return; }
  if (drag && drag.id !== e.pointerId) { firePulse(); return; }     // second finger = pulse
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
stage.addEventListener('pointermove', e => {
  if (S.state === 'title') { pointer = e.pointerType === 'mouse' && !onControl(e) ? toGame(e) : null; return; }
  if (S.state !== 'play') return;
  if (e.pointerType === 'mouse') { const p = toGame(e); player.tx = p.x; player.ty = p.y; return; }
  if (drag && drag.id === e.pointerId) {
    player.tx += (e.clientX - drag.x) / scale * 1.25; player.ty += (e.clientY - drag.y) / scale * 1.25;
    drag.x = e.clientX; drag.y = e.clientY; constrain(player);
  }
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('pointerleave', () => { pointer = null; });
stage.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (e.repeat) return;
  keys[k] = true;
  if (S.hangar) {                       // in the hangar the arrow keys browse and Escape leaves
    if (k === 'ArrowLeft') cycle(-1); else if (k === 'ArrowRight') cycle(1); else if (k === 'Escape') closeHangar();
    return;
  }
  if (S.how) { if ((k === 'Enter' || k === 'Escape' || k === ' ') && !e.target.closest('button')) closeHow(); return; }
  if (k === ' ' || k === 'x') { if (S.state === 'play') { audioInit(); firePulse(); } else if (k === ' ' && S.state === 'title' && !onControl(e)) startPressed(); }
  else if (k === 'Enter' && !onControl(e)) { if (S.state === 'title') startPressed(); else if (S.state === 'over') startGame(); else if (S.state === 'pause') setPause(false); }
  else if (k === 'p' || k === 'Escape') setPause(S.state === 'play');
});
window.addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- boot ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.034, (ts - (last || ts)) / 1000); last = ts;
  if (S.state !== 'pause') update(dt);
  draw(); syncHud();
  requestAnimationFrame(frame);
}
function start(data) {
  initGL(); fit(); initLang();
  if (MUSIC_SRC) fetch(MUSIC_SRC).then(r => r.ok ? r.blob() : Promise.reject()).then(b => {   // the built-in soundtrack
    if (AU.el || AU.buf) return;                       // the player already picked their own music
    const was = AU.playing;
    useTrack(URL.createObjectURL(b), '', b, true);
    if (was) musicStart();
  }).catch(() => {});
  if (reduced) { addImpact(dome.cx - 40, dome.cy - 62, 1); S.t += 0.25; }
  new ResizeObserver(fit).observe(app);
  window.addEventListener('orientationchange', fit);
  window.addEventListener('resize', fit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({})); } catch {} }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
